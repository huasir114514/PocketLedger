name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Extract source archive when uploaded from a phone
        run: |
          if [ -f PocketLedger-source.zip ]; then
            unzip -oq PocketLedger-source.zip
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Verify financial rules
        run: bash scripts/test-core.sh
      - name: Verify real ledger code using host SQLite
        run: bash scripts/test-database-host.sh
      - name: Build and lint
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Verify APK permissions
        shell: bash
        run: |
          permissions="$($ANDROID_HOME/build-tools/35.0.0/aapt dump permissions app/build/outputs/apk/debug/app-debug.apk)"
          if printf '%s' "$permissions" | grep -q "android.permission.INTERNET"; then
            echo 'Unexpected INTERNET permission in APK'
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: PocketLedger-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
  database-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Extract source archive when uploaded from a phone
        run: |
          if [ -f PocketLedger-source.zip ]; then
            unzip -oq PocketLedger-source.zip
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: gradle --no-daemon connectedDebugAndroidTest
